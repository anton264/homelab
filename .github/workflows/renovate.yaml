name: Renovate

on:
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        description: Select the environment

jobs:
  renovate:
    environment: ${{ inputs.environment }}
    runs-on: arc-runner-set-renovate
    container:
      image: ubuntu:24.04
      #options: --user 0
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v44.2.3
        with:
          renovate-image: ghcr.io/renovatebot/renovate:default
          token: ${{ secrets.GITHUBCOMTOKEN }}
