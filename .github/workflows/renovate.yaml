name: Renovate

on:
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        description: Select the environment

jobs:
  renovate:
    environment: ${{ inputs.environment }}
    runs-on: arc-runner-set-renovate
    steps:
      - name: Debug Secret Visibility
        run: |
          if [ -z "${{ secrets.GITHUBCOMTOKEN }}" ]; then
            echo "GITHUBCOMTOKEN is NOT visible"
          else
            echo "GITHUBCOMTOKEN is visible"
          fi
      - name: Checkout
        uses: actions/checkout@v6.0.1
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v44.2.3
        with:
          token: ${{ secrets.GITHUBCOMTOKEN }}
        env:
          GITHUB_COM_TOKEN: ${{ secrets.GITHUBCOMTOKEN }}
          RENOVATE_TOKEN: ${{ secrets.GITHUBCOMTOKEN }}
          LOG_LEVEL: debug
