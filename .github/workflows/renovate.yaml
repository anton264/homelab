name: Renovate

on:
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        description: Select the environment

jobs:
  renovate:
    environment: ${{ inputs.environment }}
    runs-on: arc-runner-set-renovate
    container:
      image: ghcr.io/renovatebot/renovate:full
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v44.2.3
        with:
          renovate-image: ghcr.io/renovatebot/renovate:full
          configurationFile: renovate-config.js
          docker-user: root
          token: ${{ secrets.GITHUBCOMTOKEN }}
