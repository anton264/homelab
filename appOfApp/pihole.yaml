apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pihole
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://mojo2600.github.io/pihole-kubernetes/
    targetRevision: 2.29.1
    chart: pihole
    helm:
      values: |
        podDnsConfig:
          enabled: true
          policy: "None"
          nameservers:
          - 127.0.0.1
          - 1.1.1.1
        serviceWeb:
          type: ClusterIP
          port: 80
        serviceDns:
          mixedService: true
          type: LoadBalancer
          port: 53
        ingress:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            io.cilium/lb-ipam-ips: "10.1.2.101"
          pathType: Prefix
          hosts:
            - pihole.kallhall.cc  # Replace with your domain
          tls:
            - secretName: pi-hole-tls
              hosts:
                - pihole.kallhall.cc
          ingressClassName: cilium
        admin:
          existingSecret: "pihole-admin"
  destination:
    server: https://kubernetes.default.svc
    namespace: pihole
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
