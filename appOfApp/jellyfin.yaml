apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://jellyfin.github.io/jellyfin-helm
    targetRevision: 2.7.0
    helm:
      values: |-
        volumes:
        - name: 'render-device'
          hostPath:
            path: '/dev/dri/renderD128'
        volumeMounts:
        - name: 'render-device'
          mountPath: '/dev/dri/renderD128'
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          # getent group render | cut -d: -f3
          supplementalGroups: 
            - 105
          privileged: true
        nodeSelector:
          kubernetes.io/hostname: adele
        persistence:
          media:
            enabled: true
            size: 1400Gi
            existingClaim: jellyfin-media
            type: pvc
        ingress:
          enabled: true
          className: cilium
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            io.cilium/lb-ipam-ips: "10.1.2.90"
            ingress.cilium.io/loadbalancer-mode: "dedicated"
          hosts:
            - host: jellyfin.kallhall.cc
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: jellyfin
              hosts:
                - jellyfin.kallhall.cc
    chart: jellyfin
  destination:
    server: https://kubernetes.default.svc
    namespace: jellyfin
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
