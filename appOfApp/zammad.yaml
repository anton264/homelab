apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zammad
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://zammad.github.io/zammad-helm
    targetRevision: 16.2.1
    chart: zammad
    helm:
      values: |-
        ingress:
          enabled: true
          className: cilium
          hosts:
            - host: zammad.kallhall.lan
              paths:
                - path: /
                  pathType: Prefix
  destination:
    server: https://kubernetes.default.svc
    namespace: zammad
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
